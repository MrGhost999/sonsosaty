
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgive Me, Sondosaty ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #10050d;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 35%, #5e102c 0%, #250916 40%, #10050d 75%);
    z-index: -2;
}

.glow {
    position: fixed;
    width: 280px;
    height: 280px;
    background: #ff1744;
    filter: blur(140px);
    opacity: .2;
    z-index: -1;
    animation: glow 4s infinite alternate;
}

@keyframes glow {
    from { transform: scale(.8); opacity: .12; }
    to { transform: scale(1.3); opacity: .3; }
}

.card {
    width: min(92%, 520px);
    padding: 35px 25px;
    border: 1px solid #ff6b8a55;
    border-radius: 28px;
    background: rgba(35, 7, 22, .78);
    box-shadow: 0 0 60px #ff174422;
    backdrop-filter: blur(12px);
    animation: appear 1.5s ease;
    margin: 25px 0;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(35px); }
    to { opacity: 1; transform: translateY(0); }
}

.heart {
    font-size: 85px;
    display: inline-block;
    filter: drop-shadow(0 0 18px #ff1744);
    animation: beat 1.1s infinite;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
}

h1 {
    color: #ff809b;
    font-size: clamp(28px, 7vw, 39px);
    margin: 15px 0;
    text-shadow: 0 0 20px #ff174455;
}

.subtitle {
    color: #ffd5df;
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.message {
    color: #f9e8ee;
    font-size: 16px;
    line-height: 1.9;
    min-height: 145px;
    white-space: pre-line;
}

.name {
    color: #ff809b;
    font-weight: bold;
}

.buttons {
    margin-top: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
}

button {
    border: none;
    padding: 14px 22px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.yes {
    background: linear-gradient(135deg, #ff456b, #c60040);
    color: white;
    box-shadow: 0 0 22px #ff174455;
}

.yes:hover {
    transform: scale(1.07);
    box-shadow: 0 0 35px #ff174499;
}

.later {
    background: #ffffff12;
    border: 1px solid #ffffff30;
    color: #ffdce5;
}

.later:hover {
    background: #ffffff25;
}

#response {
    display: none;
    margin-top: 25px;
    padding: 18px;
    border-radius: 16px;
    background: #ff174418;
    color: #ffd5df;
    line-height: 1.8;
    animation: appear .8s ease;
}

.footer {
    margin-top: 28px;
    font-size: 12px;
    color: #c68b9d;
}

.floating-heart {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: -1;
}

@keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    15% { opacity: .8; }
    to { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
}

.sparkle {
    position: fixed;
    color: #ffc1d0;
    animation: twinkle 2s infinite alternate;
    pointer-events: none;
}

@keyframes twinkle {
    from { opacity: .15; transform: scale(.7); }
    to { opacity: .9; transform: scale(1.2); }
}
</style>
</head>

<body>
<div class="background"></div>
<div class="glow"></div>

<div class="card">
    <div class="heart">❤️‍🩹</div>

    <div class="subtitle">A MESSAGE FROM MY HEART</div>

    <h1>I'm Sorry, Sondosaty</h1>

    <div class="message" id="message"></div>

    <div class="buttons" id="buttons" style="display:none">
        <button class="yes" onclick="forgive()">
            ❤️ I'll Give You a Chance
        </button>

        <button class="later" onclick="later()">
            🥺 I Need Some Time
        </button>
    </div>

    <div id="response"></div>

    <div class="footer">
        MADE WITH LOVE, JUST FOR YOU ❤️
    </div>
</div>

<script>
const text = `My beautiful Sondosaty... ❤️

I know that saying "I'm sorry" cannot erase what happened.
I know I may have hurt you, and that is the last thing I ever wanted.

You mean more to me than my pride, more than any argument,
and more than these words could ever explain.

I'm not asking you to forget everything.
I'm only asking you to let me show you that I can do better.

If I could go back in time, I would choose your smile
over every mistake I made.

You are precious to me, Sondosaty.
And from the bottom of my heart...
I'm truly sorry. 💔`;

let i = 0;
const message = document.getElementById("message");

function typeText() {
    if (i < text.length) {
        message.textContent += text.charAt(i);
        i++;
        setTimeout(typeText, 36);
    } else {
        document.getElementById("buttons").style.display = "flex";
    }
}

function forgive() {
    document.getElementById("response").style.display = "block";
    document.getElementById("response").innerHTML =
        "🥹❤️ You have no idea how much this means to me, Sondosaty.<br><br>" +
        "Thank you for giving me a chance. I promise I'll try my best " +
        "to protect your smile and make things right. 💖<br><br>" +
        "I love you, my Sondosaty. 🌹";

    document.getElementById("buttons").style.display = "none";
    burstHearts();
}

function later() {
    document.getElementById("response").style.display = "block";
    document.getElementById("response").innerHTML =
        "I understand, my love. ❤️<br><br>" +
        "Take all the time you need. I won't pressure you. " +
        "Your feelings matter to me, and I'm truly sorry. 🥺";
}

function makeHeart() {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.textContent = ["❤️", "💕", "💗", "🌹", "💖"][
        Math.floor(Math.random() * 5)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 22) + "px";
    heart.style.animationDuration = (5 + Math.random() * 6) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 11000);
}

function burstHearts() {
    for (let j = 0; j < 35; j++) {
        setTimeout(makeHeart, j * 80);
    }
}

function makeStars() {
    for (let j = 0; j < 25; j++) {
        const star = document.createElement("div");
        star.className = "sparkle";
        star.textContent = "✦";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        star.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(star);
    }
}

makeStars();
typeText();
setInterval(makeHeart, 850);
</script>
</body>
</html>
